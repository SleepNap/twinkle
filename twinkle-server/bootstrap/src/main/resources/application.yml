# ============== twinkle-server 基础配置（架构 4.1/4.2 装配档位） ==============
# 默认档：single（全部内嵌一份内存，2C2G 红线 15 强制）
# 启动时通过 -Dtwinkle.profile=split-channel 覆盖
twinkle:
  profile: ${TWINKLE_PROFILE:single}

  # ============== 服务端全局语言（参考北斗的 service.language） ==============
  # Java 后台日志、异常、HTTP 消息和系统文案统一跟随；WZ、脚本使用各自显式路径，不受此项控制。
  service:
    language: ${TWINKLE_SERVICE_LANGUAGE:zh-CN}

  # ============== 数据库（架构 6.2：按需三档） ==============
  # 默认：SQLite（低配 standalone，路径相对运行目录）
  # 大服 PostgreSQL：-Dtwinkle.db.url=jdbc:postgresql://host:5432/dbname
  # MySQL/PG：目标库不存在时会先连接 mysql/postgres 系统库自动创建；账号需有 CREATE DATABASE 权限。
  # 自动建库继承数据库服务器默认字符集、排序规则/区域设置，不在应用内硬编码。
  # 注意：Micronaut @Property 默认值（代码内）处理 jdbc: 前缀的安全；此处只留纯值
  db:
    url: jdbc:sqlite:./data/twinkle.db
    user: ""
    password: ""
    # MySQL/PG 自动按 JDBC URL 前缀决定 dialect；显式覆盖可用 twinkle.db.dialect
    dialect: ${TWINKLE_DB_DIALECT:auto}

  # ============== 登录服 Netty（架构 M1：v83 客户端连接） ==============
  # v83 客户端经典登录端口 8484；与 Micronaut HTTP 各自独立 EventLoop（红线 4）
  net:
    login:
      port: ${TWINKLE_LOGIN_PORT:8484}
    # 频道服端口（M2 进图：选角后客户端重连；单进程默认与登录服错开）
    # split 档每频道进程独占一个端口（如 8584 / 8585 / ...），经 TWINKLE_CHANNEL_PORT 指定
    channel:
      # 登录服通过 v83 SERVER_IP 回包告诉客户端连接频道时使用的 IPv4；不是监听地址。
      # 登录服和频道服的 Netty 端口均默认监听所有网卡；公网部署时这里填写客户端可达的公网 IPv4。
      host: ${TWINKLE_CHANNEL_HOST:127.0.0.1}
      port: ${TWINKLE_CHANNEL_PORT:8584}
      # 频道 id（split 档每频道进程 1 / 2 / ...；single 档恒 1）
      id: ${TWINKLE_CHANNEL_ID:1}

  # ============== 内部通信 coordinator（架构 4.6.4 注册中心：channel 上报/心跳/路由） ==============
  # 星形拓扑中心（架构 4.5）。split 档频道进程/管理进程连此地址；single 档不启用（进程内实现）。
  coordinator:
    host: ${TWINKLE_COORDINATOR_HOST:127.0.0.1}
    port: ${TWINKLE_COORDINATOR_PORT:8510}

  # 服务器列表展示名（LoginServer 响应 SERVERLIST 用）
  server:
    # API 权限、审计与 Cursor 绑定使用的稳定 ID；生产环境必须显式配置且不得随展示名变化。
    id: ${TWINKLE_SERVER_ID:twinkle-local}
    name: ${TWINKLE_SERVER_NAME:twinkle}
    environment: ${TWINKLE_SERVER_ENVIRONMENT:development}
    version: ${TWINKLE_SERVER_VERSION:}

  # ============== WZ / 脚本数据源（架构 6.4：直接指定路径、单份数据、读不到启动报错） ==============
  wz:
    path: ${TWINKLE_WZ_PATH:E:\LocalGit\GitHub\BeiDou-Server\gms-server\wz}
  script:
    path: ${TWINKLE_SCRIPT_PATH:E:\LocalGit\GitHub\BeiDou-Server\gms-server\scripts}

  # ============== API Key 与限流（/api、/internal 统一认证、Scope 授权和审计） ==============
  http:
    api:
      # 首次签发管理密钥的根凭据。必须由环境变量注入；留空时除 OpenAPI 外全部拒绝。
      # 建议仅首次签发 keys:manage key 时使用，随后从运行环境移除。
      bootstrap-key: ${TWINKLE_API_BOOTSTRAP_KEY:}
      # 短期分页 Cursor 的 HMAC 密钥；生产环境应显式配置以支持重启后继续分页。
      cursor-signing-key: ${TWINKLE_CURSOR_SIGNING_KEY:}
      rate-limit:
        # 令牌桶容量（峰值并发请求数）
        capacity: ${TWINKLE_HTTP_RATE_CAPACITY:100}
        # 补满周期（秒）
        refill-seconds: ${TWINKLE_HTTP_RATE_REFILL:1}
    # ============== Web 控制台管理面鉴权（强鉴权 + RBAC + 审计） ==============
    admin:
      # 会话有效期（秒），默认 24h
      session-ttl-seconds: ${TWINKLE_ADMIN_SESSION_TTL_SECONDS:86400}

# ============== log4j2 ==============
log4j2:
  configurationFile: log4j2.xml

# MyBatis SQL 调试日志默认关闭；开发排查时设置 TWINKLE_SQL_LOG_LEVEL=DEBUG。

# ============== Micronaut HTTP（管理进程用，默认监听所有网卡） ==============
# 不配置 host 时 Micronaut/Netty 按端口绑定所有本机地址；/api 与 /internal 统一走 API Key，
# /admin 走管理员会话 + RBAC。部署侧仍应使用 TLS、反向代理和防火墙控制入口。
micronaut:
  server:
    port: ${TWINKLE_HTTP_PORT:8686}
  router:
    static-resources:
      openapi:
        mapping: /api-docs/**
        paths: classpath:META-INF/swagger
      swagger-ui:
        mapping: /docs/**
        paths: classpath:META-INF/swagger/views/swagger-ui
