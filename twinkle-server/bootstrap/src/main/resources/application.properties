# ============== twinkle-server 基础配置（架构 4.1/4.2 装配档位） ==============
# 默认档：single（全部内嵌一份内存，2C2G 红线 15 强制）
# 启动时通过 -Dtwinkle.profile=split-channel 覆盖
twinkle.profile=${TWINKLE_PROFILE:single}

# ============== 数据库（架构 6.2：按需三档） ==============
# 默认：SQLite（低配 standalone，路径相对运行目录）
# 大服 PostgreSQL：-Dtwinkle.db.url=jdbc:postgresql://host:5432/dbname
# 注意：Micronaut @Property 默认值（代码内）处理 jdbc: 前缀的安全；此处只留纯值，不用嵌套占位符
twinkle.db.url=jdbc:sqlite:./data/twinkle.db
twinkle.db.user=
twinkle.db.password=

# MySQL/PG 自动按 JDBC URL 前缀决定 dialect；显式覆盖可用 twinkle.db.dialect
twinkle.db.dialect=${TWINKLE_DB_DIALECT:auto}

# ============== log4j2 ==============
log4j2.configurationFile=log4j2.xml

# ============== Micronaut HTTP（管理进程用，默认禁用） ==============
# 单进程档下管理进程内嵌，HTTP 端口 8080 默认；可由 -Dmicronaut.server.port=8080 改
micronaut.server.port=${TWINKLE_HTTP_PORT:8080}
