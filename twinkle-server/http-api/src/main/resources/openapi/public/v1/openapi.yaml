openapi: 3.1.0
info:
  title: Twinkle Public API v1
  version: 0.1.0
  description: >-
    Stable public v1 contract. Authorization, scope and server-resource
    checks are repeated by the server for every execution. Credential secrets never appear in URLs.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerCredential: []
paths:
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiContract
      security: []
      responses:
        '200':
          description: This OpenAPI document
          content:
            application/yaml:
              schema: {type: string}
  /api/v1/online:
    get:
      operationId: getOnlineOverview
      x-required-scope: player.online:read
      responses:
        '200':
          description: Current online-player snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OnlineOverview'}
  /api/v1/account/{name}:
    get:
      operationId: getAccountByName
      x-required-scope: game:read
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Persisted account summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountResponse'}
        '404': {description: Account not found}
  /api/v1/account/{accountId}/characters:
    get:
      operationId: listAccountCharacters
      x-required-scope: game:read
      parameters:
        - {name: accountId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: Characters persisted for the account in the default world
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CharacterResponse'}
  /api/v1/characters/{characterId}/session:
    delete:
      operationId: disconnectCharacterSession
      x-required-scope: game:write
      parameters:
        - {name: characterId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '204': {description: Character session disconnected}
        '404': {description: Character is not online}
  /api/v1/identity/me:
    get:
      operationId: getCurrentIdentity
      responses:
        '200':
          description: Safe Subject, Credential, server and permission snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentitySnapshot'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/capabilities:
    get:
      operationId: listCapabilities
      parameters:
        - {name: profile, in: query, required: false, schema: {type: string}}
        - {name: query, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: If-None-Match, in: header, required: false, schema: {type: string}}
      responses:
        '200':
          description: Lightweight Tool summaries visible to the current Credential
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityCatalog'}
        '304': {description: Cached catalog is current}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/capabilities/{toolId}:
    get:
      operationId: getCapability
      parameters:
        - {name: toolId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Full Tool contract with JSON Schema 2020-12 input and output definitions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolDescription'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/tool-executions:
    post:
      operationId: executeTool
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolExecutionRequest'}
      responses:
        '200':
          description: Synchronous Result Envelope for the MVP read-only Tools
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolExecutionResult'}
        '400': {$ref: '#/components/responses/InvalidInput'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/SnapshotChanged'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ToolUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/tool-executions/{executionId}:
    get:
      operationId: getToolExecution
      parameters:
        - {name: executionId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Previously completed Result Envelope visible to the current Subject
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolExecutionResult'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/auth/keys:
    get:
      operationId: listApiKeys
      x-required-scope: keys:manage
      responses:
        '200': {description: Credential metadata without secrets}
    post:
      operationId: issueApiKey
      x-required-scope: keys:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueKeyRequest'}
      responses:
        '201':
          description: The token is returned exactly once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedKey'}
  /api/v1/auth/keys/{keyPrefix}:
    delete:
      operationId: revokeApiKey
      x-required-scope: keys:manage
      parameters:
        - {name: keyPrefix, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Credential revoked immediately}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/auth/keys/{keyPrefix}/rotate:
    post:
      operationId: rotateApiKey
      x-required-scope: keys:manage
      parameters:
        - {name: keyPrefix, in: path, required: true, schema: {type: string}}
      responses:
        '201':
          description: Equal-or-narrower replacement Credential; old Credential is revoked
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/auth/keys/{keyPrefix}/disable:
    post:
      operationId: disableApiKey
      x-required-scope: keys:manage
      parameters:
        - {name: keyPrefix, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Credential disabled}
        '404': {description: Credential not found}
  /api/v1/auth/keys/{keyPrefix}/enable:
    post:
      operationId: enableApiKey
      x-required-scope: keys:manage
      parameters:
        - {name: keyPrefix, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Credential enabled}
        '404': {description: Credential not found}
  /api/v1/auth/keys/{keyPrefix}/scopes:
    put:
      operationId: updateApiKeyScopes
      x-required-scope: keys:manage
      parameters:
        - {name: keyPrefix, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateScopesRequest'}
      responses:
        '200': {description: Updated credential metadata}
        '400': {description: Scope request is invalid}
        '404': {description: Credential not found}
components:
  securitySchemes:
    bearerCredential:
      type: http
      scheme: bearer
      bearerFormat: twinkle-credential
  responses:
    InvalidInput:
      description: Envelope or Tool input violates the contract/schema
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Unauthenticated:
      description: Credential is missing, invalid, expired, disabled or revoked
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    PermissionDenied:
      description: Current Credential is not authorized for the Tool/resource
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    NotFound:
      description: Resource does not exist or is hidden from the current Subject
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    SnapshotChanged:
      description: Cursor snapshot is stale; restart pagination
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    RateLimited:
      description: IP, Credential or Credential+Tool rate limit exceeded
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    ToolUnavailable:
      description: Tool dependency is not ready
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    InternalError:
      description: Safe unclassified server failure
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  schemas:
    OnlineOverview:
      type: object
      required: [onlineCount, players]
      properties:
        onlineCount: {type: integer, minimum: 0}
        players:
          type: array
          items:
            type: object
            required: [characterId, name, mapId, level, job]
            properties:
              characterId: {type: integer, format: int64}
              name: {type: string}
              mapId: {type: integer}
              level: {type: integer}
              job: {type: integer}
    AccountResponse:
      type: object
      required: [id, name, banned, gender, characterslots]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        banned: {type: boolean}
        gender: {type: integer}
        characterslots: {type: integer}
    CharacterResponse:
      type: object
      required: [id, name, level, job, map, meso]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        level: {type: integer}
        job: {type: integer}
        map: {type: integer}
        meso: {type: integer}
    ServerIdentity:
      type: object
      required: [serverId, displayName, environment]
      additionalProperties: false
      properties:
        serverId: {type: string}
        displayName: {type: string}
        environment: {enum: [development, test, staging, production]}
        version: {type: [string, 'null']}
    IdentitySnapshot:
      type: object
      required: [contractVersion, subject, credential, server, effectiveScopes, resourceSelectors, permissionVersion, generatedAt]
      properties:
        contractVersion: {const: '0.1'}
        subject:
          type: object
          required: [subjectId, displayName]
          properties:
            subjectId: {type: string}
            displayName: {type: string}
        credential:
          type: object
          required: [credentialId, type, expiresAt]
          properties:
            credentialId: {type: string}
            type: {const: api_key}
            expiresAt: {type: [string, 'null'], format: date-time}
        server: {$ref: '#/components/schemas/ServerIdentity'}
        effectiveScopes: {type: array, items: {type: string}}
        resourceSelectors: {type: array, items: {type: object}}
        permissionVersion: {type: string}
        generatedAt: {type: string, format: date-time}
    CapabilityCatalog:
      type: object
      required: [contractVersion, catalogVersion, permissionVersion, tools, generatedAt]
      properties:
        contractVersion: {const: '0.1'}
        catalogVersion: {type: string}
        permissionVersion: {type: string}
        tools:
          type: array
          items: {$ref: '#/components/schemas/ToolSummary'}
        generatedAt: {type: string, format: date-time}
    ToolSummary:
      type: object
      required: [toolId, toolVersion, title, summary, provider, categories, tags, riskLevel, availability, permissionState]
      properties:
        toolId: {enum: [server.health.read, player.online.list, player.inventory.read]}
        toolVersion: {const: 1.0.0}
        title: {type: string}
        summary: {type: string}
        provider: {const: server}
        categories: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
        riskLevel: {enum: [read, sensitive_read]}
        availability: {enum: [available, unavailable]}
        permissionState: {enum: [allowed]}
    ToolDescription:
      type: object
      required: [contractVersion, toolId, toolVersion, title, description, provider, schemaDialect, inputSchema, outputSchema, permission, risk, execution, result, audit]
      properties:
        contractVersion: {const: '0.1'}
        toolId: {type: string}
        toolVersion: {const: 1.0.0}
        title: {type: string}
        description: {type: string}
        provider: {const: server}
        schemaDialect: {const: 'https://json-schema.org/draft/2020-12/schema'}
        inputSchema: {type: object}
        outputSchema: {type: object}
        permission: {type: object}
        risk: {type: object}
        execution: {type: object}
        result: {type: object}
        audit: {type: object}
    ToolExecutionRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, requestId, toolId, toolVersion, input, dryRun, clientContext]
      properties:
        contractVersion: {const: '0.1'}
        requestId: {type: string, maxLength: 128}
        taskId: {type: [string, 'null'], maxLength: 128}
        stepId: {type: [string, 'null'], maxLength: 128}
        toolId: {enum: [server.health.read, player.online.list, player.inventory.read]}
        toolVersion: {const: 1.0.0}
        input: {type: object}
        dryRun: {const: false}
        idempotencyKey: {type: 'null'}
        approvalToken: {type: 'null'}
        clientContext:
          type: object
          additionalProperties: false
          required: [source]
          properties:
            locale: {type: [string, 'null'], maxLength: 32}
            source: {enum: [desktop, web, plugin, local_im, server_im]}
            intentSummary: {type: [string, 'null'], maxLength: 512}
    ToolExecutionResult:
      type: object
      required: [contractVersion, executionId, requestId, status, output, content, artifacts, auditRef, completedAt]
      properties:
        contractVersion: {const: '0.1'}
        executionId: {type: string}
        requestId: {type: string}
        status: {const: succeeded}
        output: {oneOf: [{$ref: '#/components/schemas/HealthOutput'}, {$ref: '#/components/schemas/OnlinePlayersOutput'}, {$ref: '#/components/schemas/PlayerInventoryOutput'}]}
        content: {type: array, items: {type: object}}
        artifacts: {type: array, items: {type: object}}
        auditRef: {type: string}
        completedAt: {type: string, format: date-time}
    HealthOutput:
      type: object
      required: [server, status, checks, observedAt]
      additionalProperties: false
      properties:
        server: {$ref: '#/components/schemas/ServerIdentity'}
        status: {enum: [healthy, degraded, unhealthy, unknown]}
        checks: {type: array, items: {type: object}}
        observedAt: {type: string, format: date-time}
    OnlinePlayersOutput:
      type: object
      required: [serverId, snapshotVersion, onlineCount, returnedCount, players, nextCursor, observedAt]
      additionalProperties: false
      properties:
        serverId: {type: string}
        snapshotVersion: {type: string}
        onlineCount: {type: integer, minimum: 0}
        returnedCount: {type: integer, minimum: 0}
        players:
          type: array
          items:
            type: object
            required: [characterId, name, level, jobId, mapId]
            additionalProperties: false
            properties:
              characterId: {type: string}
              name: {type: string}
              level: {type: integer, minimum: 0}
              jobId: {type: integer, minimum: 0}
              mapId: {type: integer, minimum: 0}
        nextCursor: {type: [string, 'null']}
        observedAt: {type: string, format: date-time}
    PlayerInventoryOutput:
      type: object
      additionalProperties: false
      required: [serverId, characterId, name, stateVersion, itemCount, items, observedAt]
      properties:
        serverId: {type: string}
        characterId: {type: string, pattern: '^[1-9][0-9]*$'}
        name: {type: string}
        stateVersion: {type: string, pattern: '^[0-9]+$'}
        itemCount: {type: integer, minimum: 0}
        items:
          type: array
          items: {$ref: '#/components/schemas/InventoryItemView'}
        observedAt: {type: string, format: date-time}
    InventoryItemView:
      type: object
      additionalProperties: false
      required: [inventoryType, position, itemType, itemId, quantity, cashId, petId, owner, flag, expiration]
      properties:
        inventoryType: {type: integer, minimum: 1, maximum: 5}
        position: {type: integer}
        itemType: {enum: [item, equip, pet]}
        itemId: {type: integer}
        quantity: {type: integer, minimum: 1}
        cashId: {type: string, pattern: '^[0-9]+$'}
        petId: {type: string, pattern: '^[0-9]+$'}
        owner: {type: string}
        flag: {type: integer}
        expiration: {type: integer, format: int64, description: 'Unix 毫秒时间戳；-1 表示永不过期，0 不具有永久语义。'}
        equip: {$ref: '#/components/schemas/InventoryEquipView'}
        pet: {$ref: '#/components/schemas/InventoryPetView'}
    InventoryEquipView:
      type: object
      additionalProperties: false
      properties:
        upgradeSlots: {type: integer}
        level: {type: integer}
        strength: {type: integer}
        dexterity: {type: integer}
        intelligence: {type: integer}
        luck: {type: integer}
        hp: {type: integer}
        mp: {type: integer}
        weaponAttack: {type: integer}
        magicAttack: {type: integer}
        weaponDefense: {type: integer}
        magicDefense: {type: integer}
        accuracy: {type: integer}
        avoidability: {type: integer}
        hands: {type: integer}
        speed: {type: integer}
        jump: {type: integer}
        vicious: {type: integer}
        itemLevel: {type: integer}
        itemExp: {type: integer, format: int64}
        ringId: {type: integer}
    InventoryPetView:
      type: object
      additionalProperties: false
      required: [name, level, closeness, fullness, attribute, skill, remainLife, itemAttribute]
      properties:
        name: {type: string}
        level: {type: integer}
        closeness: {type: integer}
        fullness: {type: integer}
        attribute: {type: integer}
        skill: {type: integer}
        remainLife: {type: integer}
        itemAttribute: {type: integer}
    ErrorEnvelope:
      type: object
      required: [contractVersion, requestId, executionId, error]
      properties:
        contractVersion: {const: '0.1'}
        requestId: {type: string}
        executionId: {type: [string, 'null']}
        error:
          type: object
          required: [code, message, retryable, details]
          properties:
            code: {enum: [invalid_input, unauthenticated, permission_denied, resource_not_found, snapshot_changed, rate_limited, tool_unavailable, timeout, internal_error]}
            message: {type: string}
            retryable: {type: boolean}
            details: {type: object}
    IssueKeyRequest:
      type: object
      required: [displayName, scopes]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 128}
        ownerAccountId: {type: integer, format: int64}
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [server.health:read, player.online:read, player.inventory:read, game:read, game:write, keys:manage]
        expiresAt: {type: [string, 'null'], format: date-time}
    UpdateScopesRequest:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [server.health:read, player.online:read, player.inventory:read, game:read, game:write, keys:manage]
    IssuedKey:
      type: object
      required: [credentialId, keyPrefix, token, displayName, subjectId, scopes, serverId, createdAt]
      properties:
        credentialId: {type: string}
        keyPrefix: {type: string}
        token: {type: string, writeOnly: true}
        displayName: {type: string}
        subjectId: {type: string}
        scopes: {type: array, items: {type: string}}
        serverId: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
