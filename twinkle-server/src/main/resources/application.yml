server:
  port: 8686

spring:
  main:
    log-startup-info: false
  datasource:
    url: jdbc:sqlite:data/twinkle.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

mybatis-flex:
  configuration:
    default-statement-timeout: 300
  global-config:
    print-banner: false

logging:
  level:
    root: warn
  file:
    path: logs/${twinkle.role}

twinkle:
  # 进程角色：single / gateway / channel / coordinator
  role: single
  # 默认语言：zh-CN / en-US
  language: zh-CN
