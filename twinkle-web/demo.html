<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twinkle Web</title>
    <style>
      :root {
        color: #171717;
        background: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 460px);
        border: 1px solid #e5e5e5;
        border-radius: 10px;
        padding: 24px;
        box-shadow: 0 1px 2px rgb(0 0 0 / 4%);
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 16px; color: #737373; line-height: 1.6; }
      code {
        display: block;
        margin-bottom: 16px;
        padding: 12px;
        border-radius: 7px;
        background: #f5f5f5;
        color: #171717;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      a {
        display: inline-flex;
        height: 34px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        padding: 0 14px;
        background: #171717;
        color: #fafafa;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
      }
      small { display: block; margin-top: 14px; color: #a3a3a3; }
    </style>
  </head>
  <body>
    <main>
      <h1>Twinkle Web 已迁移到正式应用</h1>
      <p>旧的静态 Notion Demo 已停用。当前页面由 React、Vite 和 shadcn 构建，请先在本目录启动开发服务器：</p>
      <code>npm run dev</code>
      <a href="http://127.0.0.1:5173/">打开 shadcn 控制台</a>
      <small>入口保留用于兼容原有书签；正式页面源码位于 src/App.tsx。</small>
    </main>
  </body>
</html>
